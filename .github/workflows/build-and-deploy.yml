# Builds the site on every pull request and push to main, and deploys it to Cloudflare Pages.
#
# A pull request deploys as a preview on its own branch alias (reported in the job summary);
# main deploys to production at docs.triodian.com.
#
# Secrets to set once in this repository (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with Cloudflare Pages: Edit on the Triodian account
#   CLOUDFLARE_ACCOUNT_ID  the account id
# The Pages project is named "triodian-docs" with docs.triodian.com as its custom domain.
# Without the secrets the build still runs and the deploy step is skipped, so forks and
# outside pull requests get a build check and no deploy.

name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so changes in the app repos' docs/ folders reach the site even when
    # nothing changed here.
    - cron: '17 20 * * 0'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check front matter
        run: npm run check

      - name: Pull app docs and build
        env:
          CI: 'true'
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set: build only, no deploy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          npx wrangler pages deploy build --project-name triodian-docs --branch "$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "Deployed **$BRANCH** to $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Comment the preview link on the pull request
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\nPreview: ${url}`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
